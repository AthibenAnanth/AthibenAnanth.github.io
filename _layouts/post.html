<html>

{% include head.html %}

<body>

    {% include header.html %} 
    
    
<!-- Main -->
<div id="main" class="alt">

<!-- One -->
<section id="one">
    <div class="inner">
        <header class="major">
            <h1>{{ page.title }}</h1>
            <p style="opacity: 0.7; font-size: 0.9em; margin-top: -1em; letter-spacing: 1px;">
              POSTED ON {{ page.date | date: "%B %-d, %Y" | upcase }}
            </p>
        </header>
        {% if page.image %}<span class="image main"><img src="{{ site.baseurl }}/{{ page.image }}" alt="" /></span>{% endif %}
        {{ content }}
    </div>
</section>

</div>

    {% include footer.html %}

<!-- CMS Image & Caption Automation -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Find ALL images inside the post body
    const postImages = document.querySelectorAll("section#one .inner img");
    
    postImages.forEach(img => {
      // Skip the main featured banner image at the top of the page
      if (img.parentElement.classList.contains("image") && img.parentElement.classList.contains("main")) return;
      
      // Force the image to become a centered block, even if it's inside a bullet point
      img.style.display = "block";
      img.style.maxWidth = "85%";
      img.style.height = "auto";
      img.style.margin = "2rem auto 0.5rem auto";
      
      // Generate the italic caption from the Title field
      if (img.title) {
        const caption = document.createElement("span");
        caption.innerHTML = "<em>" + img.title + "</em>";
        caption.style.display = "block";
        caption.style.textAlign = "center";
        caption.style.opacity = "0.8";
        caption.style.marginBottom = "2rem";
        img.insertAdjacentElement("afterend", caption);
      }
    });
  });
</script>
    
</body>

</html>
