<section id="contact">
    <div class="inner">
        <section class="split">
            <section>
                <div class="contact-method">
                    <span class="icon alt fa-envelope"></span>
                    <h3>Email</h3>
                    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
                </div>
            </section>
            <section>
                <div class="contact-method">
                    <span class="icon alt fa-home"></span>
                    <h3>Address</h3>
                    <span>
                    {{ site.street_address }}<br />
                    {{ site.city }}, {{ site.state }} {{ site.zip_code }}<br />
                    {{ site.country }}
                    </span>
                </div>
            </section>
        </section>
    </div>
</section>
